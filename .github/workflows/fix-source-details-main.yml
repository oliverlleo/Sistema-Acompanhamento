name: Fix Firebase sourceDetails keys

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-source-details-main.yml'

permissions:
  contents: write

jobs:
  fix-source-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch active importer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/app.js')
          text = path.read_text(encoding='utf-8')

          helper_anchor = """const normalizeText = (value = '') => String(value)\n  .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')\n  .replace(/[^a-zA-Z0-9]+/g, ' ').trim().toLowerCase();\n"""
          helper_code = """const normalizeText = (value = '') => String(value)\n  .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')\n  .replace(/[^a-zA-Z0-9]+/g, ' ').trim().toLowerCase();\nfunction safeFirebaseKey(value, fallback = 'campo') {\n  const sanitized = String(value ?? '').replace(/[.#$\\/\\[\\]]/g, '_').trim();\n  return sanitized || fallback;\n}\nfunction safeFirebaseObject(value) {\n  if (Array.isArray(value)) return value.map(safeFirebaseObject);\n  if (!value || typeof value !== 'object') return value;\n  const output = {};\n  Object.entries(value).forEach(([rawKey, child]) => {\n    const base = safeFirebaseKey(rawKey);\n    let key = base;\n    let suffix = 2;\n    while (Object.prototype.hasOwnProperty.call(output, key)) key = `${base}_${suffix++}`;\n    output[key] = safeFirebaseObject(child);\n  });\n  return output;\n}\n"""

          old_row = """    row.forEach((value, index) => { if (!mappedIndexes.has(index) && value !== '' && value !== null && imp.headers[index]) details[imp.headers[index]] = value; });\n"""
          new_row = """    row.forEach((value, index) => {\n      if (mappedIndexes.has(index) || value === '' || value === null || value === undefined || !imp.headers[index]) return;\n      const base = safeFirebaseKey(imp.headers[index], `Coluna_${index + 1}`);\n      let key = base;\n      let suffix = 2;\n      while (Object.prototype.hasOwnProperty.call(details, key)) key = `${base}_${suffix++}`;\n      details[key] = value;\n    });\n"""

          old_payload = """      ...row, id, projectId, category: category || row.category || 'Importado',\n      source: row.source || state.importer.defaultSource || 'compra',\n"""
          new_payload = """      ...row, id, projectId, category: category || row.category || 'Importado',\n      sourceDetails: safeFirebaseObject(row.sourceDetails || {}),\n      source: row.source || state.importer.defaultSource || 'compra',\n"""

          if 'function safeFirebaseKey(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('normalizeText anchor not found')
              text = text.replace(helper_anchor, helper_code, 1)

          if old_row in text:
              text = text.replace(old_row, new_row, 1)
          elif 'const base = safeFirebaseKey(imp.headers[index]' not in text:
              raise SystemExit('sourceDetails row writer not found')

          if old_payload in text:
              text = text.replace(old_payload, new_payload, 1)
          elif 'sourceDetails: safeFirebaseObject(row.sourceDetails || {})' not in text:
              raise SystemExit('import payload anchor not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check public/app.js

      - name: Commit fix to main
        shell: bash
        run: |
          if git diff --quiet -- public/app.js; then
            echo 'Fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'fix: sanitize Firebase sourceDetails keys'
          git push origin HEAD:main
