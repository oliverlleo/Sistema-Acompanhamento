name: Publish Acompanhamento view

on:
  push:
    paths:
      - '.github/workflows/publish-acompanhamento.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Acompanhamento
        run: |
          python - <<'PY'
          from pathlib import Path

          detail = Path('public/acompanhamento-detail.js')
          text = detail.read_text(encoding='utf-8')

          replacements = [
            ("label: 'Comprado', tone: 'blue', value: data.purchasedQty", "title: 'Comprado', tone: 'blue', value: data.purchasedQty"),
            ("label: 'Em pintura', tone: 'violet', value: data.inPaintingQty", "title: 'Em pintura', tone: 'violet', value: data.inPaintingQty"),
            ("label: 'Conferido', tone: 'amber', value: data.readyQty", "title: 'Conferido', tone: 'amber', value: data.readyQty"),
            ("label: 'Separado', tone: 'green', value: data.separatedQty", "title: 'Separado', tone: 'green', value: data.separatedQty"),
            ("<span class=\"trk-stage-copy\"><strong>${escapeHtml(meta.label === '0%' ? meta.label.replace('0%', '') || key : meta.label) || escapeHtml(key)}</strong><span>${formatQty(meta.value)} de ${formatQty(meta.total)}</span></span>",
             "<span class=\"trk-stage-copy\"><strong>${escapeHtml(meta.title)}</strong><span>${formatQty(meta.value)} de ${formatQty(meta.total)}</span></span>")
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Pattern not found in detail: {old[:60]}')
            text = text.replace(old, new, 1)
          detail.write_text(text, encoding='utf-8')

          route = Path('public/route-features.js')
          route_text = route.read_text(encoding='utf-8')
          import_line = "import './acompanhamento-detail.js?v=20260803-1505';\n"
          if import_line not in route_text:
            marker = "import './direct-paint-delivery.js?v=20260803-1122';\n"
            if marker not in route_text:
              raise SystemExit('Route feature import marker not found')
            route_text = route_text.replace(marker, marker + import_line, 1)
          route.write_text(route_text, encoding='utf-8')

          app = Path('public/app.js')
          app_text = app.read_text(encoding='utf-8')
          old_route = "estoque: ['Materiais separados', 'Acompanhamento da separação por obra e categoria'],"
          new_route = "estoque: ['Acompanhamento', 'Compras, pintura, conferência e separação por obra'],"
          if old_route not in app_text:
            raise SystemExit('App route title marker not found')
          app.write_text(app_text.replace(old_route, new_route, 1), encoding='utf-8')

          separated = Path('public/separated-projects.js')
          separated_text = separated.read_text(encoding='utf-8')
          separated_replacements = [
            ("<div><h2>Separados por obra</h2><p>Acompanhe o avanço, localize uma obra e abra somente os materiais que já tiveram separação.</p></div>",
             "<div><h2>Acompanhamento por obra</h2><p>Localize uma obra para acompanhar compras, pintura, materiais conferidos e separação.</p></div>"),
            ("if (title) title.textContent = 'Separados';", "if (title) title.textContent = 'Acompanhamento';"),
            ("if (subtitle) subtitle.textContent = 'Materiais separados organizados por obra';", "if (subtitle) subtitle.textContent = 'Compras, pintura, conferência e separação por obra';")
          ]
          for old, new in separated_replacements:
            if old not in separated_text:
              raise SystemExit(f'Separated screen marker not found: {old[:55]}')
            separated_text = separated_text.replace(old, new, 1)
          separated.write_text(separated_text, encoding='utf-8')

          index = Path('public/index.html')
          index_text = index.read_text(encoding='utf-8')
          old_menu = '<button data-route="estoque" class="nav-item"><span>✓</span>Separados</button>'
          new_menu = '<button data-route="estoque" class="nav-item"><span>◉</span>Acompanhamento</button>'
          if old_menu not in index_text:
            raise SystemExit('Index menu marker not found')
          index_text = index_text.replace(old_menu, new_menu, 1)
          import re
          index_text, count = re.subn(
            r'\./route-features\.js\?v=[0-9-]+',
            './route-features.js?v=20260803-1505',
            index_text,
            count=1
          )
          if count != 1:
            raise SystemExit('Route cache marker not found')
          index.write_text(index_text, encoding='utf-8')
          PY

          node --check public/acompanhamento-detail.js
          node --check public/separated-projects.js
          node --check public/route-features.js
          node --check public/app.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/acompanhamento-detail.js public/route-features.js public/app.js public/separated-projects.js public/index.html
          git commit -m "Turn separated view into project tracking dashboard" || exit 0
          git push
