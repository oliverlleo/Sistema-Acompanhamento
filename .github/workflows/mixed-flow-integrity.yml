name: Mixed flow integrity reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mixed-flow-integrity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integrity corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          flow_path = Path('public/material-flow.js')
          flow = flow_path.read_text(encoding='utf-8')
          flow = replace_once(
              flow,
              "export function purchaseNeedsAction(material = {}) {\n  const { purchaseQty, unallocatedQty } = allocation(material);\n  return unallocatedQty > 0 || (purchaseQty > 0 && !purchaseCommitted(material));\n}",
              "export function sourceNeedsDefinition(material = {}) {\n  return allocation(material).unallocatedQty > 0;\n}\n\nexport function purchaseNeedsAction(material = {}) {\n  const { purchaseQty } = allocation(material);\n  return purchaseQty > 0 && !purchaseCommitted(material);\n}",
              'separate source and purchase actions'
          )
          flow = replace_once(
              flow,
              "    commitmentProgress: 0,\n    comprar: 0,",
              "    commitmentProgress: 0,\n    definirOrigem: 0,\n    comprar: 0,",
              'source summary field'
          )
          flow = replace_once(
              flow,
              "    if (purchaseNeedsAction(material)) summary.comprar += 1;",
              "    if (sourceNeedsDefinition(material)) summary.definirOrigem += 1;\n    else if (purchaseNeedsAction(material)) summary.comprar += 1;",
              'source summary counting'
          )
          flow_path.write_text(flow, encoding='utf-8')

          commitment_path = Path('public/commitment-summary.js')
          commitment = commitment_path.read_text(encoding='utf-8')
          commitment = replace_once(
              commitment,
              "      ['pending', 'committed', 'commitmentProgress'].forEach(field => {",
              "      ['total', 'completed', 'pending', 'committed', 'commitmentProgress', 'definirOrigem', 'comprar', 'aguardandoEntrega', 'comprasAtrasadas', 'pintura', 'pinturaAtrasada', 'separar', 'separados', 'enviados', 'progress'].forEach(field => {",
              'full summary reconciliation'
          )
          commitment_path.write_text(commitment, encoding='utf-8')

          app_path = Path('public/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              "      total: materials.length, completed: 0, pending: 0, committed: 0, commitmentProgress: 0,\n      comprar: 0, aguardandoEntrega: 0, comprasAtrasadas: 0,",
              "      total: materials.length, completed: 0, pending: 0, committed: 0, commitmentProgress: 0,\n      definirOrigem: 0, comprar: 0, aguardandoEntrega: 0, comprasAtrasadas: 0,",
              'app source summary field'
          )
          app = replace_once(
              app,
              "    if (allocation.unallocatedQty > 0 || materialPurchaseNeedsAction(item)) summary.comprar += 1;",
              "    if (allocation.unallocatedQty > 0) summary.definirOrigem += 1;\n    else if (materialPurchaseNeedsAction(item)) summary.comprar += 1;",
              'app source summary counting'
          )
          app = replace_once(
              app,
              "  const purchaseIssues = summaries.reduce((sum, s) => sum + num(s.comprar) + num(s.comprasAtrasadas), 0);",
              "  const purchaseIssues = summaries.reduce((sum, s) => sum + num(s.definirOrigem) + num(s.comprar) + num(s.comprasAtrasadas), 0);",
              'dashboard source issues'
          )
          app = replace_once(
              app,
              "      ${kpiCard('Compras para agir', purchaseIssues, 'Sem compra ou fora do prazo', '◎', 'danger')}",
              "      ${kpiCard('Origem/compras para agir', purchaseIssues, 'Sem origem, sem compra ou fora do prazo', '◎', 'danger')}",
              'dashboard purchase label'
          )
          app = replace_once(
              app,
              "    if (num(s.comprar)) alerts.push({ tone: 'warning', title: `${project.name}: ${s.comprar} item(ns) sem compra/reserva`, text: 'Há materiais que ainda precisam de uma ação inicial.', projectId: id, route: 'compras' });",
              "    if (num(s.definirOrigem)) alerts.push({ tone: 'warning', title: `${project.name}: ${s.definirOrigem} item(ns) sem origem definida`, text: 'Defina compra, estoque ou uma divisão entre as duas origens.', projectId: id, route: 'materiais' });\n    if (num(s.comprar)) alerts.push({ tone: 'warning', title: `${project.name}: ${s.comprar} item(ns) com compra não registrada`, text: 'Registre fornecedor, pedido e previsão de chegada.', projectId: id, route: 'compras' });",
              'dashboard source and purchase alerts'
          )
          app = replace_once(
              app,
              "      ${flowCard('Comprar / reservar', num(summary.comprar), num(summary.comprar) ? 'danger' : '')}",
              "      ${flowCard('Definir / comprar', num(summary.definirOrigem) + num(summary.comprar), num(summary.definirOrigem) + num(summary.comprar) ? 'danger' : '')}",
              'flow source card'
          )

          guard = """    const previousAllocation = materialAllocation(material);
    const nextAllocation = materialAllocation({ ...material, ...entries });
    const allocationChanged = previousAllocation.source !== nextAllocation.source
      || Math.abs(previousAllocation.stockQty - nextAllocation.stockQty) > 0.000001
      || Math.abs(previousAllocation.purchaseQty - nextAllocation.purchaseQty) > 0.000001;
    const hasOperationalMovement = Boolean(
      material.purchaseDate || material.orderNumber || num(material.qtyReceived) > 0
      || num(material.paintingSentQty) > 0 || num(material.paintingReturnedQty) > 0
      || num(material.separatedQty) > 0 || num(material.siteDeliveredQty) > 0
    );
    if (materialId && allocationChanged && hasOperationalMovement) {
      setBusy(button, false);
      toast('A divisão entre compra e estoque não pode ser alterada depois que o material já teve movimentação. Corrija primeiro as movimentações ou crie um novo material.', 'error');
      return;
    }
"""
          app = replace_once(
              app,
              "    const id = materialId || push(ref(db, `materials/${state.currentProjectId}`)).key;",
              guard + "    const id = materialId || push(ref(db, `materials/${state.currentProjectId}`)).key;",
              'manual allocation movement guard'
          )

          minimums = """    const minimums = {
      qtyReceived: num(material.qtyReceived),
      paintingSentQty: num(material.paintingSentQty),
      paintingReturnedQty: num(material.paintingReturnedQty),
      separatedQty: num(material.separatedQty),
      siteDeliveredQty: num(material.siteDeliveredQty)
    };
    for (const [field, minimum] of Object.entries(minimums)) {
      if (field in data && data[field] < minimum - 0.000001) {
        setBusy(button, false);
        toast(`A quantidade total não pode diminuir. O valor atual é ${fmtQty(minimum)} ${material.unit || 'un'}.`, 'error');
        return;
      }
    }
"""
          app = replace_once(
              app,
              "    for (const [field, limit] of Object.entries(limits)) {",
              minimums + "    for (const [field, limit] of Object.entries(limits)) {",
              'cumulative quantity lower bounds'
          )
          app_path.write_text(app, encoding='utf-8')

          source_path = Path('public/bulk-source-choice-v2.js')
          source = source_path.read_text(encoding='utf-8')
          helper = """function hasOperationalMovement(material = {}) {
  return Boolean(
    material.purchaseDate || material.orderNumber || number(material.qtyReceived) > 0
    || number(material.paintingSentQty) > 0 || number(material.paintingReturnedQty) > 0
    || number(material.separatedQty) > 0 || number(material.siteDeliveredQty) > 0
  );
}

"""
          source = replace_once(
              source,
              "function allocationChanges(material, mode, stockValue, userId, timestamp) {",
              helper + "function allocationChanges(material, mode, stockValue, userId, timestamp) {",
              'bulk movement helper'
          )
          bulk_guard = """  for (const materialId of validIds) {
    const material = state.materials[materialId];
    const old = allocation(material);
    const targetStock = mode === 'estoque' ? old.required : mode === 'misto' ? clamp(number(stockById[materialId]), 0, old.required) : 0;
    const targetPurchase = mode === 'compra' ? old.required : mode === 'misto' ? old.required - targetStock : 0;
    const changed = old.source !== mode
      || Math.abs(old.stockQty - targetStock) > 0.000001
      || Math.abs(old.purchaseQty - targetPurchase) > 0.000001;
    if (changed && hasOperationalMovement(material)) {
      toast(`${material.description || 'Material'} já possui movimentação e não pode ter a divisão alterada.`, 'error');
      return;
    }
  }

"""
          source = replace_once(
              source,
              "  const originalLabel = button.textContent;",
              bulk_guard + "  const originalLabel = button.textContent;",
              'bulk allocation movement guard'
          )
          source_path.write_text(source, encoding='utf-8')
          PY
      - name: Verify syntax
        run: |
          node --check public/material-flow.js
          node --check public/commitment-summary.js
          node --check public/app.js
          node --check public/bulk-source-choice-v2.js
          node --check public/bulk-purchase.js
      - name: Commit integrity changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/material-flow.js public/commitment-summary.js public/app.js public/bulk-source-choice-v2.js
          git commit -m 'Reconcile source definition, purchases, and cumulative quantities'
          git push
