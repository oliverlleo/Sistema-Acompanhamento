name: Publish separated projects view

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-separated-projects-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation and cache
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('<button data-route="estoque" class="nav-item"><span>▤</span>Estoque</button>', '<button data-route="estoque" class="nav-item"><span>✓</span>Separados</button>'),
              ('./app.js?v=20260803-0959', './app.js?v=20260803-1348'),
              ('./route-features.js?v=20260803-1335', './route-features.js?v=20260803-1348')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Pattern not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Publish separated materials project view"
          git push
