name: Fix Firebase import keys and cache

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-firebase-keys-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Harden Firebase keys and bust stale cache
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          version = '20260818-1439'

          app = Path('public/app.js')
          text = app.read_text(encoding='utf-8')
          old = """function safeFirebaseKey(value, fallback = 'campo') {\n  const sanitized = String(value ?? '').replace(/[.#$\\/\\[\\]]/g, '_').trim();\n  return sanitized || fallback;\n}\n"""
          new = """function safeFirebaseKey(value, fallback = 'campo') {\n  const sanitized = String(value ?? '')\n    .normalize('NFKC')\n    .replace(/[\\u0000-\\u001F\\u007F]/g, '_')\n    .replace(/[.#$\\/\\[\\]]/g, '_')\n    .replace(/\\s+/g, '_')\n    .replace(/_+/g, '_')\n    .replace(/^_+|_+$/g, '');\n  return sanitized || fallback;\n}\n"""
          if old not in text:
              raise SystemExit('safeFirebaseKey app.js anchor not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          xlsx = Path('public/xlsx-import-fix.js')
          text = xlsx.read_text(encoding='utf-8')
          old_variants = [
              """function safeFirebaseKey(value, fallback = 'campo') {\n  return String(value || fallback).replace(/[.#$\\/\\[\\]]/g, '_').trim() || fallback;\n}\n""",
              """function safeFirebaseKey(value, fallback = 'campo') {\n  const sanitized = String(value ?? '').replace(/[.#$\\/\\[\\]]/g, '_').trim();\n  return sanitized || fallback;\n}\n"""
          ]
          replacement = new
          changed = False
          for old_variant in old_variants:
              if old_variant in text:
                  text = text.replace(old_variant, replacement, 1)
                  changed = True
                  break
          if not changed and ".normalize('NFKC')" not in text:
              raise SystemExit('safeFirebaseKey xlsx-import-fix.js anchor not found')
          xlsx.write_text(text, encoding='utf-8')

          index = Path('public/index.html')
          text = index.read_text(encoding='utf-8')
          import re
          text, count = re.subn(r'(<script type="module" src="\./app\.js\?v=)[^"]+("[^>]*></script>)', rf'\g<1>{version}\2', text, count=1)
          if count != 1:
              raise SystemExit('app.js version anchor not found')
          index.write_text(text, encoding='utf-8')

          sw = Path('public/sw.js')
          text = sw.read_text(encoding='utf-8')
          text, count = re.subn(r"const CACHE_NAME = 'obraflow-shell-v[^']+';", f"const CACHE_NAME = 'obraflow-shell-v{version}';", text, count=1)
          if count != 1:
              raise SystemExit('CACHE_NAME anchor not found')
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          node --check public/app.js
          node --check public/xlsx-import-fix.js
          node --check public/sw.js
          git diff --check
          grep -F "normalize('NFKC')" public/app.js
          grep -F 'app.js?v=20260818-1439' public/index.html
          grep -F "obraflow-shell-v20260818-1439" public/sw.js

      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/xlsx-import-fix.js public/index.html public/sw.js
          git commit -m 'fix: harden Firebase import keys and refresh cache'
          git push origin HEAD:main
