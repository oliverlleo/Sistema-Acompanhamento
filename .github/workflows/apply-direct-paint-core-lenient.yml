name: Apply direct painting core tolerant

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-direct-paint-core-lenient.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  pintura_atrasada: { label: 'Pintura atrasada', tone: 'danger', stage: 60 },\n  pronto_separar: { label: 'Pronto para separar', tone: 'success', stage: 74 },", "  pintura_atrasada: { label: 'Pintura atrasada', tone: 'danger', stage: 60 },\n  pintura_retorno_parcial: { label: 'Retorno parcial da pintura', tone: 'warning', stage: 68 },\n  pronto_separar: { label: 'Pronto para separar', tone: 'success', stage: 74 },", 1)
          old = """function materialPurchaseCommitted(material) {
  const { purchaseQty } = materialAllocation(material);
  if (purchaseQty <= 0) return true;
  if (material.purchaseDate || material.orderNumber || num(material.qtyReceived) > 0) return true;
  return ['aguardando_entrega', 'compra_atrasada', 'recebido_parcial'].includes(material.status);
}

function materialReceivedPurchaseQty(material) {
  const { purchaseQty } = materialAllocation(material);
  return clamp(num(material.qtyReceived), 0, purchaseQty);
}

function materialAvailableQty(material) {
  const { required, stockQty } = materialAllocation(material);
  return clamp(stockQty + materialReceivedPurchaseQty(material), 0, required);
}

function materialSeparableQty(material) {
"""
          new = """function materialPurchaseDeliveryToPainting(material) {
  const { purchaseQty } = materialAllocation(material);
  return Boolean(material.paintingRequired && purchaseQty > 0 && material.purchaseDeliveryDestination === 'pintura');
}

function materialDirectPaintingDeliveredQty(material) {
  const { purchaseQty } = materialAllocation(material);
  if (!materialPurchaseDeliveryToPainting(material)) return 0;
  return clamp(num(material.directPaintingDeliveredQty), 0, purchaseQty);
}

function materialPurchaseCommitted(material) {
  const { purchaseQty } = materialAllocation(material);
  if (purchaseQty <= 0) return true;
  if (material.purchaseDate || material.orderNumber || num(material.qtyReceived) > 0 || num(material.directPaintingDeliveredQty) > 0) return true;
  return ['aguardando_entrega', 'compra_atrasada', 'recebido_parcial', 'em_pintura', 'pintura_atrasada', 'pintura_retorno_parcial'].includes(material.status);
}

function materialReceivedPurchaseQty(material) {
  const { purchaseQty } = materialAllocation(material);
  const delivered = materialPurchaseDeliveryToPainting(material)
    ? materialDirectPaintingDeliveredQty(material)
    : num(material.qtyReceived);
  return clamp(delivered, 0, purchaseQty);
}

function materialAvailableQty(material) {
  const { required, stockQty } = materialAllocation(material);
  return clamp(stockQty + materialReceivedPurchaseQty(material), 0, required);
}

function materialPaintingSentQty(material) {
  const available = materialAvailableQty(material);
  return clamp(num(material.paintingSentQty) + materialDirectPaintingDeliveredQty(material), 0, available);
}

function materialSeparableQty(material) {
"""
          s = s.replace(old, new, 1)
          s = s.replace("  const paintSent = num(material.paintingSentQty);", "  const paintSent = materialPaintingSentQty(material);", 1)
          s = s.replace("    if (paintReturned > 0) return 'pronto_separar';", "    if (paintReturned > 0) return 'pintura_retorno_parcial';", 1)
          s = s.replace("if (['enviado_obra', 'enviado_parcial', 'separado', 'separado_parcial', 'em_pintura', 'pintura_atrasada', 'pronto_separar'].includes(status))", "if (['enviado_obra', 'enviado_parcial', 'separado', 'separado_parcial', 'em_pintura', 'pintura_atrasada', 'pintura_retorno_parcial', 'pronto_separar'].includes(status))", 1)
          s = s.replace("    if (received >= purchaseQty) purchaseStage = statusMeta(material.paintingRequired ? 'aguarda_pintura' : 'pronto_separar').stage;", "    if (received >= purchaseQty) purchaseStage = material.paintingRequired\n      ? statusMeta(materialPurchaseDeliveryToPainting(material) ? 'em_pintura' : 'aguarda_pintura').stage\n      : statusMeta('pronto_separar').stage;", 1)
          s = s.replace("    pintura_atrasada: ['Registrar retorno', 'return-paint'],\n    pronto_separar:", "    pintura_atrasada: ['Registrar retorno', 'return-paint'],\n    pintura_retorno_parcial: ['Registrar retorno', 'return-paint'],\n    pronto_separar:", 1)
          s = s.replace("else if (materialAvailableQty(item) > 0 || num(item.paintingSentQty) > 0) summary.pintura += 1;", "else if (materialAvailableQty(item) > 0 || materialPaintingSentQty(item) > 0) summary.pintura += 1;", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: node --check public/app.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Add direct painting delivery core logic'
          git push
