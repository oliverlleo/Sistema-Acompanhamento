name: Corrigir chaves invalidas da importacao

on:
  push:
    paths:
      - .github/workflows/fix-firebase-invalid-source-details-keys.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanitizar nomes das colunas antes de salvar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/app.js')
          text = path.read_text(encoding='utf-8')

          old = """    const details = {};
    row.forEach((value, index) => { if (!mappedIndexes.has(index) && value !== '' && value !== null && imp.headers[index]) details[imp.headers[index]] = value; });"""

          new = """    const details = {};
    row.forEach((value, index) => {
      if (mappedIndexes.has(index) || value === '' || value === null || !imp.headers[index]) return;
      const baseKey = String(imp.headers[index])
        .trim()
        .replace(/[.#$/\\[\\]]/g, '_')
        .replace(/\\s+/g, ' ')
        .slice(0, 120) || `campo_${index + 1}`;
      let safeKey = baseKey;
      let suffix = 2;
      while (Object.prototype.hasOwnProperty.call(details, safeKey)) {
        safeKey = `${baseKey}_${suffix}`;
        suffix += 1;
      }
      details[safeKey] = value;
    });"""

          if old not in text:
              raise SystemExit('Trecho sourceDetails nao encontrado no app.js')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          index = Path('public/index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r'<script type="module" src="\\./app\\.js(?:\\?v=[^"]*)?"></script>',
              '<script type="module" src="./app.js?v=20260731-1148"></script>',
              html,
              count=1
          )
          index.write_text(html, encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: node --check public/app.js

      - name: Salvar correcao
        shell: bash
        run: |
          git config user.name "ObraFlow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js public/index.html
          git commit -m "Sanitiza nomes de colunas para o Firebase"
          git push
