name: Apply global quantity fix on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply corrections
        run: python scripts/fix_global_quantity_decimals_v2.py
      - name: Check JavaScript syntax
        run: |
          for file in public/material-flow.js public/app.js public/separated-projects.js public/acompanhamento-detail.js public/tracking-item-counts.js public/tracking-available-summary.js public/xlsx-import-fix.js public/route-features.js public/source-choice.js public/bulk-source-choice.js public/direct-paint-delivery.js; do
            node --check "$file"
          done
      - name: Commit generated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Corrigir decimais de quantidade em todo o sistema"
          git push origin HEAD:${{ github.head_ref }}
