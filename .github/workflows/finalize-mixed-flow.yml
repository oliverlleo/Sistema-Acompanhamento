name: Finalize mixed material flow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-mixed-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final flow corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('public/app.js')
          app = app_path.read_text(encoding='utf-8')

          replacements = [
            (
              "  } else if (state.route === 'materiais' && materialPurchaseNeedsAction(material)) {\n    [actionLabel, action] = ['Registrar compra', 'purchase'];\n  }",
              "  } else if (state.route === 'materiais' && allocation.unallocatedQty > 0) {\n    [actionLabel, action] = ['Definir compra/estoque', 'edit'];\n  } else if (state.route === 'materiais' && materialPurchaseNeedsAction(material)) {\n    [actionLabel, action] = ['Registrar compra', 'purchase'];\n  }",
              'pending source action'
            ),
            (
              "value=\"${escapeHtml(material.qtyReceived || required)}\"",
              "value=\"${escapeHtml(Math.max(num(material.qtyReceived), required))}\"",
              'receive cumulative default'
            ),
            (
              "value=\"${escapeHtml(material.paintingSentQty || availableNow)}\"",
              "value=\"${escapeHtml(Math.max(num(material.paintingSentQty), availableNow))}\"",
              'painting send cumulative default'
            ),
            (
              "value=\"${escapeHtml(material.paintingReturnedQty || material.paintingSentQty || availableNow)}\"",
              "value=\"${escapeHtml(Math.max(num(material.paintingReturnedQty), num(material.paintingSentQty)))}\"",
              'painting return cumulative default'
            ),
            (
              "value=\"${escapeHtml(material.separatedQty || separableNow)}\"",
              "value=\"${escapeHtml(Math.max(num(material.separatedQty), separableNow))}\"",
              'separation cumulative default'
            ),
            (
              "value=\"${escapeHtml(material.siteDeliveredQty || num(material.separatedQty))}\"",
              "value=\"${escapeHtml(Math.max(num(material.siteDeliveredQty), num(material.separatedQty)))}\"",
              'delivery cumulative default'
            )
          ]

          for old, new, label in replacements:
              if old not in app:
                  raise SystemExit(f'Pattern not found: {label}')
              app = app.replace(old, new, 1)

          app_path.write_text(app, encoding='utf-8')

          bulk_path = Path('public/bulk-purchase.js')
          bulk = bulk_path.read_text(encoding='utf-8')
          bulk = bulk.replace("      let totalPurchaseQty = 0;\n", "")
          bulk = bulk.replace("        totalPurchaseQty += alloc.purchaseQty;\n", "")
          bulk = bulk.replace(
              "        message: `Compra registrada para ${updatedCount} item(ns), totalizando ${totalPurchaseQty} unidade(s) das parcelas de compra · ${data.supplier}`,",
              "        message: `Compra registrada para ${updatedCount} item(ns) · ${data.supplier}`,"
          )
          bulk_path.write_text(bulk, encoding='utf-8')
          PY
      - name: Verify syntax
        run: |
          node --check public/app.js
          node --check public/bulk-purchase.js
      - name: Commit final corrections
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/bulk-purchase.js
          git commit -m 'Finalize partial mixed-source actions and validation'
          git push
