name: Apply direct painting delivery core

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-direct-paint-delivery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core painting flow
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          path = Path('public/app.js')
          text = path.read_text(encoding='utf-8')

          text = apply(text,
            "  pintura_atrasada: { label: 'Pintura atrasada', tone: 'danger', stage: 60 },\n  pronto_separar: { label: 'Pronto para separar', tone: 'success', stage: 74 },",
            "  pintura_atrasada: { label: 'Pintura atrasada', tone: 'danger', stage: 60 },\n  pintura_retorno_parcial: { label: 'Retorno parcial da pintura', tone: 'warning', stage: 68 },\n  pronto_separar: { label: 'Pronto para separar', tone: 'success', stage: 74 },",
            'status')

          old = """function materialPurchaseCommitted(material) {
  const { purchaseQty } = materialAllocation(material);
  if (purchaseQty <= 0) return true;
  if (material.purchaseDate || material.orderNumber || num(material.qtyReceived) > 0) return true;
  return ['aguardando_entrega', 'compra_atrasada', 'recebido_parcial'].includes(material.status);
}

function materialReceivedPurchaseQty(material) {
  const { purchaseQty } = materialAllocation(material);
  return clamp(num(material.qtyReceived), 0, purchaseQty);
}

function materialAvailableQty(material) {
  const { required, stockQty } = materialAllocation(material);
  return clamp(stockQty + materialReceivedPurchaseQty(material), 0, required);
}

function materialSeparableQty(material) {
"""
          new = """function materialPurchaseDeliveryToPainting(material) {
  const { purchaseQty } = materialAllocation(material);
  return Boolean(material.paintingRequired && purchaseQty > 0 && material.purchaseDeliveryDestination === 'pintura');
}

function materialDirectPaintingDeliveredQty(material) {
  const { purchaseQty } = materialAllocation(material);
  if (!materialPurchaseDeliveryToPainting(material)) return 0;
  return clamp(num(material.directPaintingDeliveredQty), 0, purchaseQty);
}

function materialPurchaseCommitted(material) {
  const { purchaseQty } = materialAllocation(material);
  if (purchaseQty <= 0) return true;
  if (material.purchaseDate || material.orderNumber || num(material.qtyReceived) > 0 || num(material.directPaintingDeliveredQty) > 0) return true;
  return ['aguardando_entrega', 'compra_atrasada', 'recebido_parcial', 'em_pintura', 'pintura_atrasada', 'pintura_retorno_parcial'].includes(material.status);
}

function materialReceivedPurchaseQty(material) {
  const { purchaseQty } = materialAllocation(material);
  const delivered = materialPurchaseDeliveryToPainting(material)
    ? materialDirectPaintingDeliveredQty(material)
    : num(material.qtyReceived);
  return clamp(delivered, 0, purchaseQty);
}

function materialAvailableQty(material) {
  const { required, stockQty } = materialAllocation(material);
  return clamp(stockQty + materialReceivedPurchaseQty(material), 0, required);
}

function materialPaintingSentQty(material) {
  const available = materialAvailableQty(material);
  return clamp(num(material.paintingSentQty) + materialDirectPaintingDeliveredQty(material), 0, available);
}

function materialSeparableQty(material) {
"""
          text = apply(text, old, new, 'helpers')
          text = apply(text, "  const paintSent = num(material.paintingSentQty);", "  const paintSent = materialPaintingSentQty(material);", 'derive sent')
          text = apply(text, "    if (paintReturned > 0) return 'pronto_separar';", "    if (paintReturned > 0) return 'pintura_retorno_parcial';", 'partial return')
          text = apply(text,
            "if (['enviado_obra', 'enviado_parcial', 'separado', 'separado_parcial', 'em_pintura', 'pintura_atrasada', 'pronto_separar'].includes(status))",
            "if (['enviado_obra', 'enviado_parcial', 'separado', 'separado_parcial', 'em_pintura', 'pintura_atrasada', 'pintura_retorno_parcial', 'pronto_separar'].includes(status))",
            'progress statuses')
          text = apply(text,
            "    if (received >= purchaseQty) purchaseStage = statusMeta(material.paintingRequired ? 'aguarda_pintura' : 'pronto_separar').stage;",
            "    if (received >= purchaseQty) purchaseStage = material.paintingRequired\n      ? statusMeta(materialPurchaseDeliveryToPainting(material) ? 'em_pintura' : 'aguarda_pintura').stage\n      : statusMeta('pronto_separar').stage;",
            'progress direct')
          text = apply(text,
            "    pintura_atrasada: ['Registrar retorno', 'return-paint'],\n    pronto_separar:",
            "    pintura_atrasada: ['Registrar retorno', 'return-paint'],\n    pintura_retorno_parcial: ['Registrar retorno', 'return-paint'],\n    pronto_separar:",
            'next action')
          text = apply(text,
            "else if (materialAvailableQty(item) > 0 || num(item.paintingSentQty) > 0) summary.pintura += 1;",
            "else if (materialAvailableQty(item) > 0 || materialPaintingSentQty(item) > 0) summary.pintura += 1;",
            'summary')
          text = apply(text,
            "  const delivered = num(material.siteDeliveredQty);\n\n  if (route === 'compras')",
            "  const delivered = num(material.siteDeliveredQty);\n  const paintSent = materialPaintingSentQty(material);\n\n  if (route === 'compras')",
            'route sent')
          text = apply(text,
            "&& (available > num(material.paintingReturnedQty) || num(material.paintingSentQty) > num(material.paintingReturnedQty));",
            "&& (available > num(material.paintingReturnedQty) || paintSent > num(material.paintingReturnedQty));",
            'route condition')
          text = apply(text,
            "recebimento: ['Aguardando recebimento', 'Informe a quantidade que chegou e mantenha os atrasos visíveis.'],",
            "recebimento: ['Aguardando entrega', 'Confirme a chegada na empresa ou a entrega direta na pintura.'],",
            'route text')

          text = apply(text,
            "  const paintSent = num(material.paintingSentQty);\n  const paintReturned = num(material.paintingReturnedQty);",
            "  const paintSent = materialPaintingSentQty(material);\n  const paintReturned = num(material.paintingReturnedQty);\n  const directToPainting = materialPurchaseDeliveryToPainting(material);",
            'row quantities')
          text = apply(text,
            "  else if (state.route === 'recebimento') [actionLabel, action] = ['Confirmar chegada', 'receive'];",
            "  else if (state.route === 'recebimento') [actionLabel, action] = directToPainting\n    ? ['Confirmar entrega na pintura', 'receive-paint-direct']\n    : ['Confirmar chegada', 'receive'];",
            'row direct action')
          text = apply(text,
            "    quantityNote = 'Parcela de compra';\n  } else if (state.route === 'pintura')",
            "    quantityNote = directToPainting ? 'Parcela com entrega direta na pintura' : 'Parcela de compra';\n  } else if (state.route === 'pintura')",
            'row note')
          text = apply(text,
            "  const eta = ['em_pintura', 'pintura_atrasada'].includes(status) ? material.paintingEta : material.deliveryEta;",
            "  const eta = ['em_pintura', 'pintura_atrasada', 'pintura_retorno_parcial'].includes(status) ? material.paintingEta : material.deliveryEta;",
            'eta')
          text = apply(text,
            "  const allocationNote = allocation.source === 'misto'\n    ? `${fmtQty(allocation.stockQty)} estoque + ${fmtQty(allocation.purchaseQty)} compra`\n    : '';",
            "  const allocationNote = allocation.source === 'misto'\n    ? `${fmtQty(allocation.stockQty)} estoque + ${fmtQty(allocation.purchaseQty)} compra`\n    : '';\n  const deliveryNote = directToPainting ? 'fornecedor entrega direto na pintura' : '';",
            'delivery note')
          text = apply(text,
            "${allocationNote ? `<span class=\"cell-sub\">${escapeHtml(allocationNote)}</span>` : ''}${material.paintingRequired ? '<span class=\"cell-sub\">com pintura</span>' : ''}</td>",
            "${allocationNote ? `<span class=\"cell-sub\">${escapeHtml(allocationNote)}</span>` : ''}${material.paintingRequired ? '<span class=\"cell-sub\">com pintura</span>' : ''}${deliveryNote ? `<span class=\"cell-sub\">${escapeHtml(deliveryNote)}</span>` : ''}</td>",
            'render note')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify syntax
        run: node --check public/app.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Add direct painting delivery to core screens'
          git push
