name: Replace stock with separated projects

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-stock-with-separated-projects.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stock route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/app.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  estoque: ['Estoque', 'Saldo, localização e estoque mínimo dos materiais'],",
                  "  estoque: ['Materiais separados', 'Acompanhamento da separação por obra e categoria'],"
              ),
              (
                  "    estoque: renderInventory,",
                  "    estoque: () => {\n      const renderer = window.ObraFlowSeparatedProjects?.render;\n      if (renderer) renderer();\n      else $('#view').innerHTML = '<div class=\"card\"><div class=\"empty\"><div><div class=\"empty-icon\">✓</div><h3>Carregando materiais separados</h3><p>Organizando as obras e categorias...</p></div></div></div>';\n    },"
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Pattern not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check public/app.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "Show separated materials by project instead of stock"
          git push
